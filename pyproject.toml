[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlip-lsp"
version = "0.2.0"
description = "Language Server Protocol and CLI tools for MLIP workflow manifests and ASE scripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "newtontech" }]
keywords = ["lsp", "language-server", "materials-science", "matmaster"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "lsprotocol>=2023.0.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pygls>=1.2.0,<2",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0.12",
]
lsp = [
    "pygls>=1.2.0,<2",
    "lsprotocol>=2023.0.0",
]

[project.urls]
Homepage = "https://github.com/newtontech/mlip-lsp"
Issues = "https://github.com/newtontech/mlip-lsp/issues"

[project.scripts]
mlip-lsp = "mlip_lsp.cli:lsp_main"
mlip-lint = "mlip_lsp.cli:lint_main"
mlip-fmt = "mlip_lsp.cli:fmt_main"
mlip-test = "mlip_lsp.cli:test_main"
mlip-lsp-tool = "mlip_lsp.tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlip_lsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["tests/fixtures/syntax_error_script.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
